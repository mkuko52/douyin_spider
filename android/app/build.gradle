plugins {
    id 'com.android.application'
}

android {
    namespace 'com.douyin.spider'
    compileSdk 33
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.douyin.spider"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
